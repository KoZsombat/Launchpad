# Production override for the VM: run the image built by GitHub Actions and let
# Watchtower recreate the panel when a new `:latest` digest is published.
#
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-build
#
# Local development keeps using docker-compose.yml alone (source build).
services:
  launchpad:
    image: ghcr.io/kozsombat/launchpad:latest
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    environment:
      # Only containers labelled watchtower.enable are touched (the panel itself).
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Private GHCR package: run `docker login ghcr.io` on the host, then mount
      # the credential file so Watchtower can pull.
      # - /root/.docker/config.json:/config.json
